[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/products/check/:splat"
  status = 200
  force = true
  conditions = {Host = ["check.crackedminds.co.uk"]}

[[redirects]]
  from = "/*"
  to = "/gateway/:splat"
  status = 200
  force = false
  conditions = {Host = ["gateway.crackedminds.co.uk"]}

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
